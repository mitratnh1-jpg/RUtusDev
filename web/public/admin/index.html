<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin RUtusdev</title>
<style>
:root{--bg:#080B14;--panel:#10141f;--line:#232a3d;--txt:#e9ecf5;--dim:#8d94ab;--blue:#4355FF;--sky:#38BDF8}
*{box-sizing:border-box;margin:0}body{font:15px/1.5 Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;background:#0b0f19;border:1px solid var(--line);border-radius:6px;padding:9px 11px}
button{background:var(--blue);border:0;border-radius:6px;padding:8px 14px;cursor:pointer}button.g{background:#1b2133}button.d{background:#7a2330}
#login{max-width:340px;margin:15vh auto;display:grid;gap:12px;padding:24px}h1{font:700 22px "Space Grotesk",sans-serif}
#app{display:none;grid-template-columns:200px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:20px 12px;display:grid;gap:4px;align-content:start}
nav button{background:none;text-align:left;color:var(--dim)}nav button.on{background:#1b2133;color:#fff}
main{padding:28px;max-width:900px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.row small{color:var(--dim);display:block}form{display:grid;gap:12px;background:var(--panel);padding:18px;border-radius:8px;margin:16px 0}
label{display:grid;gap:4px;color:var(--dim);font-size:13px}label.c{display:flex;gap:8px;align-items:center}label.c input{width:auto}
.err{color:#ff8a8a;min-height:1.4em}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.grid div{background:var(--panel);padding:8px;border-radius:6px;font-size:12px;word-break:break-all}.grid img{width:100%;height:100px;object-fit:cover;border-radius:4px}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:210px;gap:12px;overflow:auto;margin-top:16px;padding-bottom:12px}.kan section{background:var(--panel);padding:10px;border-radius:8px;align-content:start}.kan h3{font:500 14px 'Space Grotesk',sans-serif}.kan small{color:var(--dim)}.k{background:#0b0f19;border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:8px;display:grid;gap:6px;font-size:13px}main{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin:16px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:2px}.kpi small{color:var(--dim)}.kpi b{font:500 24px 'Space Grotesk',sans-serif}.kpi span{font-size:12px;color:var(--dim)}.kpi.warn{border-color:#a8672a}.kpi.warn span{color:#ffd479}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}.box h3{font:500 15px 'Space Grotesk',sans-serif;margin-bottom:10px}
.dim{color:var(--dim);font-size:13px}.trend{display:flex;gap:10px;align-items:flex-end;height:150px}.trend div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}.trend i{width:100%;background:var(--blue);border-radius:4px 4px 0 0}.trend small{color:var(--dim)}
.hb{display:grid;grid-template-columns:1fr 2fr 28px;gap:8px;align-items:center;padding:5px 0;font-size:13px}.hb i{display:block;height:10px;background:var(--sky);border-radius:3px}.hb b{text-align:right}
@media(max-width:700px){.cols{grid-template-columns:1fr}}
@media(max-width:700px){#app{grid-template-columns:1fr}nav{grid-auto-flow:column;overflow:auto}}
</style></head><body>
<form id="login"><h1>Admin RUtusdev</h1><input id="em" type="email" placeholder="Email" required autocomplete="username"><input id="pw" type="password" placeholder="Kata sandi" required autocomplete="current-password"><button>Masuk</button><p class="err" id="lerr"></p></form>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<script src="config.js"></script><script src="admin.js"></script></body></html>
