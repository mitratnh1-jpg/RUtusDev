<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Cetak dokumen — RUtusdev</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e9ee;font:14px/1.5 Inter,system-ui,sans-serif;color:#12141c}
.bar{max-width:794px;margin:16px auto 0;display:flex;justify-content:flex-end}.bar button{background:#4355FF;color:#fff;border:0;border-radius:6px;padding:9px 16px;font:inherit;cursor:pointer}
.page{max-width:794px;margin:12px auto 40px;background:#fff;padding:48px 52px;min-height:1000px}
.top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #080B14;padding-bottom:16px}
.logo{font:700 26px "Space Grotesk",sans-serif}.logo span{color:#38BDF8}.doc{text-align:right}.doc h1{font:300 30px "Space Grotesk",sans-serif;margin:0;letter-spacing:.02em}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:24px 0}.meta small{color:#6b6f7b;display:block}
table{width:100%;border-collapse:collapse;margin:16px 0}th{text-align:left;font-weight:500;border-bottom:1px solid #12141c;padding:8px 6px;font-size:12px}
td{padding:8px 6px;border-bottom:1px solid #e3e3e8;vertical-align:top}.r{text-align:right}.tot td{border:0;font-weight:500}.grand td{font-size:17px;border-top:2px solid #12141c}
h3{font:500 15px "Space Grotesk",sans-serif;margin:24px 0 6px}p{margin:0 0 8px;white-space:pre-line}.foot{margin-top:40px;color:#6b6f7b;font-size:12px;border-top:1px solid #e3e3e8;padding-top:10px}
.err{text-align:center;padding:60px;color:#a33}
@media print{body{background:#fff}.bar{display:none}.page{margin:0;padding:0;max-width:none;min-height:0}@page{size:A4;margin:16mm}}
</style></head><body>
<div class="bar"><button onclick="print()">Cetak / Simpan sebagai PDF</button></div>
<div class="page" id="doc"><p>Memuat…</p></div>
<script src="cetak.js"></script></body></html>
